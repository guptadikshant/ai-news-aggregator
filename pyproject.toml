[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "An AI-powered news aggregation tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
    "langgraph>=1.0.5",
    "openai>=2.14.0",
    "python-dotenv>=1.2.1",
    "groq>=1.0.0",
    "fastapi[standard]>=0.127.1",
    "uvicorn>=0.40.0",
    "tavily-python>=0.7.17",
    "pydantic-settings>=2.12.0",
    "qdrant-client>=1.16.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]
